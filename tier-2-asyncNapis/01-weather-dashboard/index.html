<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── HEADER ── -->
    <header class="header">
      <div class="header__inner">
        <div class="header__brand">
          <h1 class="header__logo">🌤️ WeatherIQ</h1>
          <p class="header__sub">Real-time weather anywhere</p>
        </div>
      </div>
    </header>

    <main class="main">
      <!-- ── SEARCH ── -->
      <section class="search-section">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search city... e.g. Kathmandu"
            autocomplete="off"
          />
          <button id="search-btn" class="search-btn">Search</button>
        </div>
        <p id="error-msg" class="error-msg hidden"></p>
      </section>

      <!-- ── LOADING ── -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p class="loading__text">Fetching weather data...</p>
      </div>

      <!-- ── WEATHER CARD (hidden until data loads) ── -->
      <section id="weather-section" class="weather-section hidden">
        <!-- CURRENT WEATHER -->
        <div class="current-card">
          <div class="current-card__top">
            <div class="current-card__location">
              <h2 id="city-name" class="city-name">--</h2>
              <p id="country" class="country">--</p>
            </div>
            <div class="current-card__date" id="current-date">--</div>
          </div>

          <div class="current-card__main">
            <div class="current-card__temp-wrap">
              <span id="weather-icon" class="weather-icon">🌤️</span>
              <span id="temperature" class="temperature">--°C</span>
            </div>
            <div class="current-card__desc-wrap">
              <p id="weather-desc" class="weather-desc">--</p>
              <p id="feels-like" class="feels-like">Feels like --°C</p>
            </div>
          </div>

          <div class="current-card__stats">
            <div class="stat">
              <span class="stat__icon">💧</span>
              <span id="humidity" class="stat__value">--%</span>
              <span class="stat__label">Humidity</span>
            </div>
            <div class="stat">
              <span class="stat__icon">💨</span>
              <span id="wind-speed" class="stat__value">-- km/h</span>
              <span class="stat__label">Wind</span>
            </div>
            <div class="stat">
              <span class="stat__icon">👁️</span>
              <span id="visibility" class="stat__value">-- km</span>
              <span class="stat__label">Visibility</span>
            </div>
            <div class="stat">
              <span class="stat__icon">🌡️</span>
              <span id="pressure" class="stat__value">-- hPa</span>
              <span class="stat__label">Pressure</span>
            </div>
          </div>
        </div>

        <!-- 5 DAY FORECAST -->
        <div class="forecast-section">
          <h3 class="forecast-section__title">5-Day Forecast</h3>
          <div id="forecast-container" class="forecast-container"></div>
        </div>
      </section>

      <!-- ── EMPTY STATE ── -->
      <div id="empty-state" class="empty-state">
        <p class="empty-state__icon">🌍</p>
        <p class="empty-state__text">Search for a city</p>
        <p class="empty-state__sub">Type a city name above to get started</p>
      </div>
    </main>

    <!-- TOAST -->
    <div id="toast" class="toast hidden">
      <span id="toast-msg"></span>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
