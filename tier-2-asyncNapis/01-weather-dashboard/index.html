<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard 🌤️</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="main">
      <header class="header">
        <h1>Weather Dashboard 🌤️</h1>
      </header>

      <!-- Search Section -->
      <div class="search-section">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search city (e.g., Kathmandu)..."
          autocomplete="off"
        />
        <button id="search-btn" class="btn btn--primary">Search</button>
      </div>

      <!-- Message Area (Loading / Errors) -->
      <div id="message-area" class="message-area hidden"></div>

      <!-- Current Weather Card -->
      <div id="current-weather" class="weather-card hidden">
        <div class="weather-card__top">
          <div>
            <h2 id="city-name" class="city-name">City</h2>
            <p id="weather-desc" class="weather-desc">Description</p>
          </div>
          <div id="weather-emoji" class="weather-emoji">☀️</div>
        </div>

        <div class="weather-card__bottom">
          <div class="temp-display">
            <span id="temp-value" class="temp-value">0</span>
            <span class="temp-unit">°C</span>
          </div>
          <div class="weather-details">
            <div class="detail-item">
              <span class="detail-label">Feels Like</span>
              <span id="feels-like" class="detail-value">0°C</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Humidity</span>
              <span id="humidity" class="detail-value">0%</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Wind</span>
              <span id="wind-speed" class="detail-value">0 km/h</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 5-Day Forecast -->
      <div id="forecast-section" class="forecast-section hidden">
        <h3 class="forecast-title">5-Day Forecast</h3>
        <div id="forecast-container" class="forecast-container">
          <!-- Forecast cards will be injected by JS -->
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
